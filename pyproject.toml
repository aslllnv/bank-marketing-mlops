
[project]
name = "bank-marketing-mlops"
version = "1.0.0"
description = "ML project for predicting bank marketing campaign responses"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas (==2.2.3)",
    "numpy (==2.2.1)",
    "scikit-learn (==1.6.0)",
    "matplotlib",
    "seaborn",
    "fastapi (==0.115.6)",
    "uvicorn[standard] (==0.34.0)",
    "clearml (==1.17.1)",
    "joblib (==1.4.2)",
    "pydantic-settings (==2.7.1)",
    "PyYAML (==6.0.2)",
    "requests (==2.32.3)",
]

[tool.poetry]
packages = [{ include = "bank_marketing", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "==8.3.4"
httpx = "==0.28.1"
ruff = "==0.8.6"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"